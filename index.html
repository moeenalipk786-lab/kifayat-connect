<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIFAYAT CONNECT - Soi Khel Qomi Ittehad</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; direction: rtl; text-align: right; }
        header { background-color: #1a365d; color: white; padding: 20px; text-align: center; }
        h1 { margin: 0; font-size: 24px; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { display: block; width: 100%; padding: 15px; background-color: #2b6cb0; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: none; }
        .btn:hover { background-color: #2c5282; }
    </style>
</head>
<body>

    <header>
        <h1>KIFAYAT CONNECT</h1>
        <p>سوئی خیل قومی اتحاد - مرکزی نظام</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>خوش آمدید، اسد اللہ کوہستانی</h3>
            <p>سوئی خیل قومی اتحاد کی آفیشل ایپ میں خوش آمدید۔ یہاں سے آپ تمام شہروں کے یونٹس، دستور، اور فلاحی نظام تک رسائی حاصل کر سکتے ہیں۔</p>
        </div>

        <button class="btn" onclick="alert('سوئی دستور جلد لوڈ ہوگا')">📜 سوئی دستور (Dastoor)</button>
        <button class="btn" onclick="alert('رکنیت فارم کا نظام')">📝 نیا رکن فارم (Membership)</button>
        <button class="btn" onclick="alert('شہروں کی فہرست اور 8 عہدیداران')">🏙️ سٹی وائز یونٹس (City Units)</button>
        <button class="btn" onclick="alert('سوئی فاؤنڈیشن امدادی نظام')">🤝 سوئی فاؤنڈیشن (Foundation)</button>
        <button class="btn" onclick="alert('عہدیدار چیٹ روم')">💬 عہدیدار چیٹ روم (Chat & Reactions)</button>
    </div>

</body>
</html>
